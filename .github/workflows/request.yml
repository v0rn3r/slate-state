# The only sanctioned way to change the rules. Run it from the Actions tab.
#
# Loosening anything - raising the limit, unlocking enforcement - is parked for
# 48 hours before it takes effect. Tightening applies at once. Nothing here can
# push the limit above the 2700s ceiling compiled into the clients.
name: Request rule change

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to change
        required: true
        type: choice
        options: [set-limit, unlock, cancel-unlock, relock]
      value:
        description: 'For set-limit: the new daily budget in seconds (max 2700)'
        required: false
        default: '2700'

concurrency:
  group: slate-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  request:
    runs-on: ubuntu-latest
    env:
      SLATE_ACTION: ${{ inputs.action }}
      SLATE_VALUE: ${{ inputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Recompute against the new head rather than rebasing - see report.yml.
      # A rule change must never be silently dropped because a device happened
      # to report a second earlier.
      - name: Apply and commit
        run: |
          git config user.name  "slate-bot"
          git config user.email "slate-bot@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            node scripts/request.mjs

            git add state.json config/limit.json
            if git diff --staged --quiet; then
              echo "nothing to change"
              exit 0
            fi

            git commit --quiet -m "request: ${SLATE_ACTION}"
            if git push --quiet origin main; then
              exit 0
            fi

            echo "attempt ${attempt}: push rejected, recomputing against the new head"
            sleep $(( (RANDOM % 4) + 1 ))
          done

          echo "::error::could not land the request after 5 attempts"
          exit 1
