# Housekeeping: rolls the day over at the 04:00 boundary and lands any change
# whose 48h cooldown has expired. Runs on a schedule so a cooldown completes
# even if no device ever checks in.
name: rollover

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: slate-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Recompute against the new head rather than rebasing - see report.yml.
      - name: Roll over and commit
        run: |
          git config user.name  "slate-bot"
          git config user.email "slate-bot@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            node scripts/rollover.mjs

            git add state.json config/limit.json
            if git diff --staged --quiet; then
              echo "nothing to roll"
              exit 0
            fi

            git commit --quiet -m "rollover"
            if git push --quiet origin main; then
              exit 0
            fi

            echo "attempt ${attempt}: push rejected, recomputing against the new head"
            sleep $(( (RANDOM % 4) + 1 ))
          done

          echo "::error::could not land the rollover after 5 attempts"
          exit 1
