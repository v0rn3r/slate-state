# The only way a device is allowed to touch the shared counter.
#
# Devices hold a token that can start this workflow and read a public repo, and
# nothing else. They submit a number and let the workflow do the arithmetic;
# they cannot edit state.json, config/limit.json, or this file.
name: report

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device id (lowercase, e.g. pc-chromium or phone)
        required: true
      day:
        description: Day key, YYYY-MM-DD
        required: true
      seconds:
        description: Total seconds this device has used today (monotonic)
        required: true

concurrency:
  group: slate-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  accrue:
    runs-on: ubuntu-latest
    env:
      SLATE_DEVICE: ${{ inputs.device }}
      SLATE_DAY: ${{ inputs.day }}
      SLATE_SECONDS: ${{ inputs.seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Recompute, never rebase.
      #
      # Two devices reporting seconds apart can still overlap, and a rebase then
      # hits a content conflict in state.json and strands the run mid-rebase -
      # which is exactly how the first real report from a phone was lost. So on
      # a rejected push, throw the local work away, take the new head, and run
      # the accrual again. That is safe precisely because a report is a running
      # total combined with max(): re-applying it against fresher state gives
      # the right answer, where replaying a diff would not.
      - name: Apply and commit
        run: |
          git config user.name  "slate-bot"
          git config user.email "slate-bot@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            node scripts/accrue.mjs

            git add state.json config/limit.json
            if git diff --staged --quiet; then
              echo "nothing to record"
              exit 0
            fi

            git commit --quiet -m "report: ${SLATE_DEVICE} ${SLATE_SECONDS}s"
            if git push --quiet origin main; then
              exit 0
            fi

            echo "attempt ${attempt}: push rejected, recomputing against the new head"
            sleep $(( (RANDOM % 4) + 1 ))
          done

          echo "::error::could not land the report after 5 attempts"
          exit 1
