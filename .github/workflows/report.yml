# The only way a device is allowed to touch the shared counter.
#
# Devices hold a fine-grained PAT scoped to Actions:write on this repo and
# nothing else. That token can start this workflow. It cannot read or write
# repository contents, so a device can never edit state.json, config/limit.json,
# or this workflow file directly - it can only submit a number and let the
# server do the arithmetic.
name: report

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device id (lowercase, e.g. pc-chrome or phone)
        required: true
      day:
        description: Day key, YYYY-MM-DD
        required: true
      seconds:
        description: Total seconds this device has used today (monotonic)
        required: true

# Serialised. Two devices reporting at once queue rather than race the commit.
concurrency:
  group: slate-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  accrue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply report
        env:
          SLATE_DEVICE: ${{ inputs.device }}
          SLATE_DAY: ${{ inputs.day }}
          SLATE_SECONDS: ${{ inputs.seconds }}
        run: node scripts/accrue.mjs

      - name: Commit
        run: |
          git config user.name  "slate-bot"
          git config user.email "slate-bot@users.noreply.github.com"
          git add state.json config/limit.json
          git diff --staged --quiet && exit 0
          git commit -m "report: ${{ inputs.device }} ${{ inputs.seconds }}s"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
          done
          exit 1
